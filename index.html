<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real-Time Budget Ledger (KES)</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // PASTE YOUR FIREBASE KEYS HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const budgetDocRef = doc(db, "budgets", "main_user_ledger");

    window.budgetData = [];

    // Real-Time Listener: Listens for cloud updates automatically
    onSnapshot(budgetDocRef, (docSnap) => {
      if (docSnap.exists()) {
        window.budgetData = docSnap.data().categories || [];
        render();
      } else {
        saveToCloud(getDefaultData());
      }
    });

    window.saveToCloud = async function(updatedData) {
      window.budgetData = updatedData;
      render();
      try {
        await setDoc(budgetDocRef, { categories: updatedData });
      } catch (e) {
        console.error("Sync Error: ", e);
      }
    };

    function getDefaultData() {
      return [
        {
          id: "income",
          title: "Income Sources",
          isIncomeCategory: true,
          items: [{ name: "Net Salary / Primary Income", amount: 120000 }]
        },
        {
          id: "mshwari_loans",
          title: "M-Shwari & Mobile Loans",
          isLoanCategory: true,
          items: [{ name: "Fuliza Overdraft", balance: 5000, payment: 2000, paid: 1000, interest: 250 }]
        },
        {
          id: "bills",
          title: "Fixed Bills & Utilities",
          items: [{ name: "Rent / Mortgage", amount: 35000, paid: 20000 }]
        },
        {
          id: "expenses",
          title: "Variable Monthly Expenses",
          isExpenseCategory: true,
          items: [{ name: "Groceries & Supplies", projected: 20000, actual: 18500 }]
        },
        {
          id: "savings",
          title: "Savings & Investment Goals",
          items: [{ name: "Chama / Sacco Deposits", amount: 10000, paid: 5000 }]
        }
      ];
    }
  </script>

  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; --text: #1e293b; --border: #cbd5e1; --danger: #ef4444; --success: #10b981; --warning: #d97706; --whatsapp: #25d366; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    @media (min-width: 768px) { body { padding: 24px; } header { flex-direction: row; justify-content: space-between; align-items: center; } .dashboard { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .card-title { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .card-value { font-size: 15px; font-weight: 700; }
    .card-value.surplus { color: var(--success); }
    .card-value.deficit { color: var(--danger); }
    .category-section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
    .item-wrapper { background: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .grid-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    label { font-size: 10px; font-weight: 600; color: #64748b; }
    input { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; }
    .btn-whatsapp { background: var(--whatsapp); font-weight: 600; }
    .btn-add { width: 100%; margin-top: 8px; background: #f1f5f9; color: var(--text); border: 1px dashed var(--border); }
    .btn-delete { background: transparent; color: var(--danger); border: none; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1 style="margin:0; font-size:22px;">Real-Time Budget</h1>
        <p style="margin:4px 0 0 0; font-size:12px; color:#64748b;">Live Web & Mobile Cloud Sync (KES)</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-whatsapp" onclick="shareOnWhatsApp()">WhatsApp Share</button>
        <button class="btn" onclick="window.print()">PDF Report</button>
      </div>
    </header>

    <div class="dashboard">
      <div class="card"><div class="card-title">Total Income</div><div class="card-value" id="total-income">KES 0</div></div>
      <div class="card"><div class="card-title">Expenses Paid</div><div class="card-value" id="total-outflows">KES 0</div></div>
      <div class="card"><div class="card-title">Net Saved</div><div class="card-value surplus" id="net-saved">KES 0</div></div>
      <div class="card"><div class="card-title">Loan Fees</div><div class="card-value" style="color:var(--warning)" id="total-interest">KES 0</div></div>
    </div>

    <div id="budget-sections"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }

    function render() {
      const container = document.getElementById("budget-sections");
      if (!container || !window.budgetData) return;
      
      let html = "";
      window.budgetData.forEach((category, catIdx) => {
        let itemsHTML = "";
        if (category.isLoanCategory) {
          itemsHTML = category.items.map((item, itemIdx) => `
            <div class="item-wrapper">
              <div><label>Loan Reference</label><input type="text" value="${escapeHtml(item.name)}" onchange="updateLoanItem(${catIdx}, ${itemIdx}, 'name', this.value)"></div>
              <div class="grid-row">
                <div><label>Balance</label><input type="number" value="${item.balance || 0}" onchange="updateLoanItem(${catIdx}, ${itemIdx}, 'balance', this.value)"></div>
                <div><label>Target</label><input type="number" value="${item.payment || 0}" onchange="updateLoanItem(${catIdx}, ${itemIdx}, 'payment', this.value)"></div>
              </div>
              <div class="grid-row">
                <div><label>Paid</label><input type="number" value="${item.paid || 0}" onchange="updateLoanItem(${catIdx}, ${itemIdx}, 'paid', this.value)"></div>
                <div><label>Fee/Interest</label><input type="number" value="${item.interest || 0}" onchange="updateLoanItem(${catIdx}, ${itemIdx}, 'interest', this.value)"></div>
              </div>
              <button class="btn-delete" onclick="removeItem(${catIdx}, ${itemIdx})">Remove</button>
            </div>
          `).join("");
        } else if (category.isIncomeCategory) {
          itemsHTML = category.items.map((item, itemIdx) => `
            <div class="item-wrapper">
              <div><label>Income Source</label><input type="text" value="${escapeHtml(item.name)}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'name', this.value)"></div>
              <div><label>Amount (KES)</label><input type="number" value="${item.amount || 0}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'amount', this.value)"></div>
              <button class="btn-delete" onclick="removeItem(${catIdx}, ${itemIdx})">Remove</button>
            </div>
          `).join("");
        } else if (category.isExpenseCategory) {
          itemsHTML = category.items.map((item, itemIdx) => `
            <div class="item-wrapper">
              <div><label>Expense Description</label><input type="text" value="${escapeHtml(item.name)}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'name', this.value)"></div>
              <div class="grid-row">
                <div><label>Projected</label><input type="number" value="${item.projected || 0}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'projected', this.value)"></div>
                <div><label>Actual</label><input type="number" value="${item.actual || 0}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'actual', this.value)"></div>
              </div>
              <button class="btn-delete" onclick="removeItem(${catIdx}, ${itemIdx})">Remove</button>
            </div>
          `).join("");
        } else {
          itemsHTML = category.items.map((item, itemIdx) => `
            <div class="item-wrapper">
              <div><label>Item Description</label><input type="text" value="${escapeHtml(item.name)}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'name', this.value)"></div>
              <div class="grid-row">
                <div><label>Target</label><input type="number" value="${item.amount || 0}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'amount', this.value)"></div>
                <div><label>Paid</label><input type="number" value="${item.paid || 0}" onchange="updateStandardItem(${catIdx}, ${itemIdx}, 'paid', this.value)"></div>
              </div>
              <button class="btn-delete" onclick="removeItem(${catIdx}, ${itemIdx})">Remove</button>
            </div>
          `).join("");
        }

        html += `
          <div class="category-section">
            <h3 style="margin:0 0 10px 0; font-size:15px; color:var(--primary);">${category.title}</h3>
            <div>${itemsHTML}</div>
            <button class="btn btn-add" onclick="addItem(${catIdx})">+ Add Line Item</button>
          </div>
        `;
      });

      container.innerHTML = html;
      calculateTotals();
    }

    function escapeHtml(str) { return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function calculateTotals() {
      let incomeTotal = 0, billsPaidTotal = 0, expensesActualTotal = 0, savingsPaidTotal = 0, interestTotal = 0;

      window.budgetData.forEach(cat => {
        if (cat.id === "income") incomeTotal += cat.items.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);
        else if (cat.id === "mshwari_loans") cat.items.forEach(i => interestTotal += parseFloat(i.interest) || 0);
        else if (cat.id === "bills") billsPaidTotal += cat.items.reduce((s, i) => s + (parseFloat(i.paid) || 0), 0);
        else if (cat.id === "expenses") expensesActualTotal += cat.items.reduce((s, i) => s + (parseFloat(i.actual) || 0), 0);
        else if (cat.id === "savings") savingsPaidTotal += cat.items.reduce((s, i) => s + (parseFloat(i.paid) || 0), 0);
      });

      const totalOutflowsPaid = billsPaidTotal + expensesActualTotal + savingsPaidTotal;
      const netSaved = incomeTotal - totalOutflowsPaid;

      document.getElementById("total-income").textContent = formatCurrency(incomeTotal);
      document.getElementById("total-outflows").textContent = formatCurrency(totalOutflowsPaid);
      document.getElementById("total-interest").textContent = formatCurrency(interestTotal);
      
      const savedEl = document.getElementById("net-saved");
      savedEl.textContent = formatCurrency(netSaved);
      savedEl.className = netSaved < 0 ? "card-value deficit" : "card-value surplus";
    }

    function formatCurrency(val) { return new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', maximumFractionDigits: 0 }).format(val); }

    function updateStandardItem(catIdx, itemIdx, field, val) {
      if (['amount','paid','projected','actual'].includes(field)) window.budgetData[catIdx].items[itemIdx][field] = parseFloat(val) || 0;
      else window.budgetData[catIdx].items[itemIdx][field] = val;
      window.saveToCloud(window.budgetData);
    }

    function updateLoanItem(catIdx, itemIdx, field, val) {
      if (['balance','payment','paid','interest'].includes(field)) window.budgetData[catIdx].items[itemIdx][field] = parseFloat(val) || 0;
      else window.budgetData[catIdx].items[itemIdx][field] = val;
      window.saveToCloud(window.budgetData);
    }

    function addItem(catIdx) {
      if (window.budgetData[catIdx].isLoanCategory) window.budgetData[catIdx].items.push({ name: "", balance: 0, payment: 0, paid: 0, interest: 0 });
      else if (window.budgetData[catIdx].isIncomeCategory) window.budgetData[catIdx].items.push({ name: "", amount: 0 });
      else if (window.budgetData[catIdx].isExpenseCategory) window.budgetData[catIdx].items.push({ name: "", projected: 0, actual: 0 });
      else window.budgetData[catIdx].items.push({ name: "", amount: 0, paid: 0 });
      window.saveToCloud(window.budgetData);
    }

    function removeItem(catIdx, itemIdx) {
      window.budgetData[catIdx].items.splice(itemIdx, 1);
      window.saveToCloud(window.budgetData);
    }

    function shareOnWhatsApp() {
      const summaryText = `*REAL-TIME FINANCIAL REPORT (KES)*\n` +
        `• *Total Income:* ${document.getElementById("total-income").textContent}\n` +
        `• *Paid Expenses:* ${document.getElementById("total-outflows").textContent}\n` +
        `• *Net Saved:* ${document.getElementById("net-saved").textContent}\n` +
        `• *Total Interest/Fees:* ${document.getElementById("total-interest").textContent}\n\n` +
        `Generated on: ${new Date().toLocaleDateString('en-KE')}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(summaryText)}`, '_blank');
    }
  </script>
</body>
</html>
